name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_CFLAGS: -std=c11 -Werror

# The upstream/ submodules are reference material only; the build never reads
# them, so all jobs check out without submodules.

jobs:
  test-linux:
    name: linux (${{ matrix.compiler }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        mode: [debug, release, sanitize, thread-sanitize]
        exclude:
          - compiler: gcc
            mode: sanitize
          - compiler: gcc
            mode: thread-sanitize
    steps:
      - uses: actions/checkout@v7
      # Recent Ubuntu kernels ship ASLR entropy that breaks ASan/TSan mappings.
      - name: Lower ASLR entropy for sanitizers
        if: matrix.mode == 'sanitize' || matrix.mode == 'thread-sanitize'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: make CC=${{ matrix.compiler }} MODE=${{ matrix.mode }} test

  test-macos:
    name: macos (clang, ${{ matrix.mode }})
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release, sanitize, thread-sanitize]
    steps:
      - uses: actions/checkout@v7
      - run: make CC=clang MODE=${{ matrix.mode }} test

  test-windows:
    name: windows (clang, ${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make
          pacboy: clang:p
      - run: make -k CC=clang MODE=${{ matrix.mode }} test

  test-c-standard:
    name: c standard (${{ matrix.standard }}, clang)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        standard: [c17, c23]
    steps:
      - uses: actions/checkout@v7
      - run: make CC=clang BASE_CFLAGS="-std=${{ matrix.standard }} -Werror" MODE=debug test

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pin clang-format: the .clang-format config uses 21+ options
      # (BinPackParameters: OnePerLine), and formatting differs across major
      # versions, so the runner's default binary is not a reliable gate.
      - run: pipx install clang-format==22.1.8
      - run: make check-format
